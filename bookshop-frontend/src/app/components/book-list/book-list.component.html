<h2>Books</h2>

<div class="filters">
  <input
    type="text"
    placeholder="Search by title"
    [(ngModel)]="searchTerm"
    (ngModelChange)="onSearchTermChange($event)"
    aria-label="Search by title" />

  <select
    [ngModel]="filters.category || ''"
    (ngModelChange)="onCategoryChange($event)"
    aria-label="Filter by category">
    <option value="">All categories</option>
    <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
  </select>

  <select
    [ngModel]="filters.sort || ''"
    (ngModelChange)="onSortChange($event)"
    aria-label="Sort by price">
    <option *ngFor="let option of sortOptions" [value]="option.value">{{ option.label }}</option>
  </select>
</div>

<p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

<ul class="book-list">
  <li *ngFor="let book of books" class="book-card">
    <img *ngIf="book.photo" [src]="book.photo" [alt]="book.title" class="book-photo" />
    <div class="book-info">
      <h3>{{ book.title }}</h3>
      <p class="author">by {{ book.author }}</p>
      <p class="category">Category: {{ book.category }}</p>
      <p class="description">{{ book.description }}</p>
      <p class="price">{{ book.price | currency }}</p>
      <div class="actions" *ngIf="isLoggedIn$ | async">
        <button type="button" (click)="addToFavorites(book)">Add to Favorites</button>
        <button type="button" (click)="buyBook(book)">Buy</button>
      </div>
    </div>
  </li>
</ul>
